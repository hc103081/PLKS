# Railway 部署配置 - 使用 Railpack
[build]
builder = "RAILPACK"
# 在 monorepo 根目錄安裝依賴 (Railpack 自動偵測 pnpm)，再只建置 @plks/api
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @plks/api run build"
watchPatterns = ["/apps/api/**", "/packages/**", "/railway.toml", "/pnpm-lock.yaml", "/package.json"]

[deploy]
# 從 monorepo 根目錄以 filter 啟動 @plks/api
startCommand = "pnpm --filter @plks/api start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# 健康檢查端點
healthcheckPath = "/health"
healthcheckTimeout = 100

# 注意：環境變數請在 Railway Dashboard → Variables 中設定
