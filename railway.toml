# Railway 部署配置 - 使用 Railpack
[build]
builder = "RAILPACK"
# 指定 Node.js 22 (Supabase realtime-js 需要原生 WebSocket)
[build.env]
NIXPACKS_NODE_VERSION = "22"

# 在 monorepo 根目錄安裝依賴，顯式先建置 @plks/shared 再建置 @plks/api
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @plks/shared run build && pnpm --filter @plks/api run build"
watchPatterns = ["/apps/api/**", "/packages/**", "/railway.toml", "/pnpm-lock.yaml", "/package.json"]

[deploy]
# 從 monorepo 根目錄以 filter 啟動 @plks/api
startCommand = "pnpm --filter @plks/api start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# 健康檢查端點
healthcheckPath = "/health"
healthcheckTimeout = 100

# 注意：環境變數請在 Railway Dashboard → Variables 中設定
